<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HeySurf - Microphone Permission</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: #0f0f0f;
      color: #e8e8e8;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      padding: 24px;
    }
    .container {
      text-align: center;
      max-width: 340px;
    }
    .icon {
      font-size: 48px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    p {
      font-size: 13px;
      color: #888;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    button {
      background: #6366f1;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 12px 32px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #818cf8; }
    button:disabled {
      background: #333;
      cursor: not-allowed;
    }
    .status {
      margin-top: 16px;
      font-size: 13px;
      min-height: 20px;
    }
    .status.success { color: #22c55e; }
    .status.error { color: #ef4444; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">🎤</div>
    <h1>HeySurf needs microphone access</h1>
    <p>Click the button below to grant microphone permission. This is needed for voice commands.</p>
    <button id="grant-btn">Grant Access</button>
    <div id="status" class="status"></div>
  </div>

  <script>
    const grantBtn = document.getElementById('grant-btn');
    const statusEl = document.getElementById('status');

    grantBtn.addEventListener('click', async () => {
      grantBtn.disabled = true;
      statusEl.textContent = 'Requesting permission...';
      statusEl.className = 'status';

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        // Stop the stream immediately — we only needed the permission
        stream.getTracks().forEach(t => t.stop());

        statusEl.textContent = 'Permission granted! Closing...';
        statusEl.className = 'status success';

        // Notify the extension
        chrome.runtime.sendMessage({ type: 'MIC_PERMISSION_GRANTED' });

        // Auto-close after 1.5s
        setTimeout(() => window.close(), 1500);
      } catch (err) {
        statusEl.textContent = 'Permission denied. Please allow microphone access in your browser settings.';
        statusEl.className = 'status error';
        grantBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
